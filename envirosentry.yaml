# Buffer raw JSON text
globals:
- id: json_buffer
  type: std::string
  restore_value: false
  initial_value: ''

- id: device_id
  type: std::string
  restore_value: no
  initial_value: '"UNKNOWN"'

- id: ir_send_code
  type: std::string
  restore_value: no
  initial_value: '""'

- id: ir_send_repeats
  type: int
  restore_value: no
  initial_value: '1'

- id: ir_send_delay
  type: int
  restore_value: no
  initial_value: '50'

- id: dark_mode_enabled
  type: bool
  restore_value: true
  initial_value: 'false'

- id: dark_mode_temp_change
  type: bool
  restore_value: no
  initial_value: 'false'

interval:
  - interval: 2000ms
    then:
      - lambda: |-
          uint8_t b;
          while (id(bridge_uart).available() && id(bridge_uart).read_byte(&b)) {
            if (b == '\n') {
              auto &raw = id(json_buffer);
              size_t pos;

              // =====================================================
              // NUMERIC SENSORS
              // =====================================================
              
              // Parse co2 - "co2":
              pos = raw.find("\"co2\":");
              if (pos != std::string::npos) id(co2_sensor).publish_state(atof(raw.substr(pos + 6).c_str()));

              // Parse temp - "temp":
              pos = raw.find("\"temp\":");
              if (pos != std::string::npos) id(temp_sensor).publish_state(atof(raw.substr(pos + 7).c_str()));

              // Parse hum - "hum":
              pos = raw.find("\"hum\":");
              if (pos != std::string::npos) id(hum_sensor).publish_state(atof(raw.substr(pos + 6).c_str()));

              // Parse pm1 - "pm1":
              pos = raw.find("\"pm1\":");
              if (pos != std::string::npos) id(pm1_sensor).publish_state(atof(raw.substr(pos + 6).c_str()));

              // Parse pm2_5 - "pm2_5":
              pos = raw.find("\"pm2_5\":");
              if (pos != std::string::npos) id(pm25_sensor).publish_state(atof(raw.substr(pos + 8).c_str()));

              // Parse pm4 - "pm4":
              pos = raw.find("\"pm4\":");
              if (pos != std::string::npos) id(pm4_sensor).publish_state(atof(raw.substr(pos + 6).c_str()));

              // Parse pm10 - "pm10":
              pos = raw.find("\"pm10\":");
              if (pos != std::string::npos) id(pm10_sensor).publish_state(atof(raw.substr(pos + 7).c_str()));

              // Parse voc - "voc":
              pos = raw.find("\"voc\":");
              if (pos != std::string::npos) id(voc_sensor).publish_state(atof(raw.substr(pos + 6).c_str()));

              // Parse nox - "nox":
              pos = raw.find("\"nox\":");
              if (pos != std::string::npos) id(nox_sensor).publish_state(atof(raw.substr(pos + 6).c_str()));

              // Parse lux - "lux":
              pos = raw.find("\"lux\":");
              if (pos != std::string::npos) id(lux_sensor).publish_state(atof(raw.substr(pos + 6).c_str()));

              // Parse bme_press - "bme_press":
              pos = raw.find("\"bme_press\":");
              if (pos != std::string::npos) id(bme_press_sensor).publish_state(atof(raw.substr(pos + 12).c_str()));

              // Parse bme_gas_kohm - "bme_gas_kohm":
              pos = raw.find("\"bme_gas_kohm\":");
              if (pos != std::string::npos) id(bme_gas_sensor).publish_state(atof(raw.substr(pos + 15).c_str()));

              // =====================================================
              // MOISTURE METRICS (NEW)
              // =====================================================
              
              // Parse abs_humidity - "abs_humidity":
              pos = raw.find("\"abs_humidity\":");
              if (pos != std::string::npos) id(abs_humidity_sensor).publish_state(atof(raw.substr(pos + 15).c_str()));

              // Parse dew_point - "dew_point":
              pos = raw.find("\"dew_point\":");
              if (pos != std::string::npos) id(dew_point_sensor).publish_state(atof(raw.substr(pos + 12).c_str()));

              // Parse vtt_index - "vtt_index":
              pos = raw.find("\"vtt_index\":");
              if (pos != std::string::npos) id(vtt_index_sensor).publish_state(atof(raw.substr(pos + 12).c_str()));

              // Parse critical_rh - "critical_rh":
              pos = raw.find("\"critical_rh\":");
              if (pos != std::string::npos) id(critical_rh_sensor).publish_state(atof(raw.substr(pos + 14).c_str()));

              // =====================================================
              // VENTILATION SCORE (NEW)
              // =====================================================
              
              // Parse vent_score - "vent_score":
              pos = raw.find("\"vent_score\":");
              if (pos != std::string::npos) id(vent_score_sensor).publish_state(atof(raw.substr(pos + 13).c_str()));

              // Parse vent_events - "vent_events":
              pos = raw.find("\"vent_events\":");
              if (pos != std::string::npos) id(vent_events_sensor).publish_state(atof(raw.substr(pos + 14).c_str()));

              // Parse co2_trend - "co2_trend":
              pos = raw.find("\"co2_trend\":");
              if (pos != std::string::npos) id(co2_trend_sensor).publish_state(atof(raw.substr(pos + 12).c_str()));

              // =====================================================
              // TEXT SENSORS
              // =====================================================

              // Parse iaq (text) - "iaq":"
              pos = raw.find("\"iaq\":");
              if (pos != std::string::npos) {
                size_t start = raw.find('"', pos + 6);
                if (start != std::string::npos) {
                  start++;
                  size_t end = raw.find('"', start);
                  if (end != std::string::npos && end > start) {
                    id(iaq_sensor).publish_state(raw.substr(start, end - start));
                  }
                }
              }

              // Parse aerosol (text) - "aerosol":"
              pos = raw.find("\"aerosol\":");
              if (pos != std::string::npos) {
                size_t start = raw.find('"', pos + 10);
                if (start != std::string::npos) {
                  start++;
                  size_t end = raw.find('"', start);
                  if (end != std::string::npos && end > start) {
                    id(aerosol_sensor).publish_state(raw.substr(start, end - start));
                  }
                }
              }

              // Parse vtt_risk (text) - "vtt_risk":"
              pos = raw.find("\"vtt_risk\":");
              if (pos != std::string::npos) {
                size_t start = raw.find('"', pos + 11);
                if (start != std::string::npos) {
                  start++;
                  size_t end = raw.find('"', start);
                  if (end != std::string::npos && end > start) {
                    id(vtt_risk_sensor).publish_state(raw.substr(start, end - start));
                  }
                }
              }

              // Parse mould_favorable (boolean as text) - "mould_favorable":
              pos = raw.find("\"mould_favorable\":");
              if (pos != std::string::npos) {
                size_t val_start = pos + 18;
                if (raw.substr(val_start, 4) == "true") {
                  id(mould_favorable_sensor).publish_state("Yes");
                } else {
                  id(mould_favorable_sensor).publish_state("No");
                }
              }

              // Parse vent_rating (text) - "vent_rating":"
              pos = raw.find("\"vent_rating\":");
              if (pos != std::string::npos) {
                size_t start = raw.find('"', pos + 14);
                if (start != std::string::npos) {
                  start++;
                  size_t end = raw.find('"', start);
                  if (end != std::string::npos && end > start) {
                    id(vent_rating_sensor).publish_state(raw.substr(start, end - start));
                  }
                }
              }

              // Parse vent_issue (text) - "vent_issue":"
              pos = raw.find("\"vent_issue\":");
              if (pos != std::string::npos) {
                size_t start = raw.find('"', pos + 13);
                if (start != std::string::npos) {
                  start++;
                  size_t end = raw.find('"', start);
                  if (end != std::string::npos && end > start) {
                    id(vent_issue_sensor).publish_state(raw.substr(start, end - start));
                  }
                }
              }
              // =====================================================
              // VAPE DETECTION MONITORING (NEW)
              // =====================================================
              
              // Parse vd_baseline_pm25 - "vd_baseline_pm25":
              pos = raw.find("\"vd_baseline_pm25\":");
              if (pos != std::string::npos) id(vd_baseline_pm25_sensor).publish_state(atof(raw.substr(pos + 19).c_str()));

              // Parse vd_baseline_voc - "vd_baseline_voc":
              pos = raw.find("\"vd_baseline_voc\":");
              if (pos != std::string::npos) id(vd_baseline_voc_sensor).publish_state(atof(raw.substr(pos + 18).c_str()));

              // Parse vd_baseline_gas - "vd_baseline_gas":
              pos = raw.find("\"vd_baseline_gas\":");
              if (pos != std::string::npos) id(vd_baseline_gas_sensor).publish_state(atof(raw.substr(pos + 18).c_str()));

              // Parse vd_pm25_delta - "vd_pm25_delta":
              pos = raw.find("\"vd_pm25_delta\":");
              if (pos != std::string::npos) id(vd_pm25_delta_sensor).publish_state(atof(raw.substr(pos + 16).c_str()));

              // Parse vd_voc_delta - "vd_voc_delta":
              pos = raw.find("\"vd_voc_delta\":");
              if (pos != std::string::npos) id(vd_voc_delta_sensor).publish_state(atof(raw.substr(pos + 15).c_str()));

              // Parse vd_baseline_samples - "vd_baseline_samples":
              pos = raw.find("\"vd_baseline_samples\":");
              if (pos != std::string::npos) id(vd_baseline_samples_sensor).publish_state(atof(raw.substr(pos + 22).c_str()));

              // Parse vd_state - "vd_state":
              pos = raw.find("\"vd_state\":");
              if (pos != std::string::npos) id(vd_state_sensor).publish_state(atof(raw.substr(pos + 11).c_str()));

              // Parse vd_peak_pm25 - "vd_peak_pm25":
              pos = raw.find("\"vd_peak_pm25\":");
              if (pos != std::string::npos) id(vd_peak_pm25_sensor).publish_state(atof(raw.substr(pos + 15).c_str()));

              // Parse vd_vape_score - "vd_vape_score":
              pos = raw.find("\"vd_vape_score\":");
              if (pos != std::string::npos) id(vd_vape_score_sensor).publish_state(atof(raw.substr(pos + 16).c_str()));

              // Parse vd_deo_score - "vd_deo_score":
              pos = raw.find("\"vd_deo_score\":");
              if (pos != std::string::npos) id(vd_deo_score_sensor).publish_state(atof(raw.substr(pos + 15).c_str()));

              // Parse vd_baseline_valid (boolean) - "vd_baseline_valid":
              pos = raw.find("\"vd_baseline_valid\":");
              if (pos != std::string::npos) {
                size_t val_start = pos + 20;
                if (raw.substr(val_start, 4) == "true") {
                  id(vd_baseline_valid_sensor).publish_state("Yes");
                } else {
                  id(vd_baseline_valid_sensor).publish_state("No");
                }
              }

              // Parse vd_secs_since_clean - "vd_secs_since_clean":
              pos = raw.find("\"vd_secs_since_clean\":");
              if (pos != std::string::npos) id(vd_secs_since_clean_sensor).publish_state(atof(raw.substr(pos + 22).c_str()));

              // Parse vd_baseline_drifting (boolean) - "vd_baseline_drifting":
              pos = raw.find("\"vd_baseline_drifting\":");
              if (pos != std::string::npos) {
                size_t val_start = pos + 23;
                if (raw.substr(val_start, 4) == "true") {
                  id(vd_baseline_drifting_sensor).publish_state("Yes");
                } else {
                  id(vd_baseline_drifting_sensor).publish_state("No");
                }
              }

              // --- Capture the full raw JSON for debugging ---
              id(last_uart_json).publish_state(raw);

              // Parse vd_air_clean (boolean) - "vd_air_clean":
              pos = raw.find("\"vd_air_clean\":");
              if (pos != std::string::npos) {
                size_t val_start = pos + 15;
                if (raw.substr(val_start, 4) == "true") {
                  id(vd_clean_air_sensor).publish_state("Yes");
                } else {
                  id(vd_clean_air_sensor).publish_state("No");
                }
              }

              // Parse vd_refractory_lockout (boolean) - "vd_refractory_lockout":
              pos = raw.find("\"vd_refractory_lockout\":");
              if (pos != std::string::npos) {
                size_t val_start = pos + 24;
                if (raw.substr(val_start, 4) == "true") {
                  id(vd_refractory_sensor).publish_state("Yes");
                } else {
                  id(vd_refractory_sensor).publish_state("No");
                }
              }

              // --- Capture the full raw JSON for debugging ---
              id(last_uart_json).publish_state(raw);

              raw.clear();
            } else {
              id(json_buffer) += (char)b;
            }
          }       


button:
- platform: template
  name: Toggle Dark Mode
  on_press:
    then:
    - lambda: |-
        id(dark_mode_enabled) = !id(dark_mode_enabled);
    - if:
        condition:
          lambda: return id(dark_mode_enabled);
        then:
        - uart.write:
            id: bridge_uart
            data: "DARK_MODE:On\n"
        else:
        - uart.write:
            id: bridge_uart
            data: "DARK_MODE:Off\n"

