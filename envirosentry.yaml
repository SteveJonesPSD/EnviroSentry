  name: Save and Reboot
  on_press:
    then:
    - uart.write:
        id: bridge_uart
        data: "SAVE_REBOOT\n"

- platform: template
  name: Set Distance
  id: set_distance
  entity_category: config
  on_press:
  - switch.turn_off: mmwave_sensor
  - delay: 1s
  - uart.write:
      id: uart_presence
      data: !lambda std::string ms = "setRange " + 
        to_string(id(range_minimum).state) + " " + 
        to_string(id(range_maximum).state); return std::vector<unsigned 
        char>(ms.begin(), ms.end());
  - delay: 1s
  - uart.write:
      id: uart_presence
      data: saveConfig
  - delay: 1s
  - switch.turn_on: mmwave_sensor

- platform: template
  name: Set Sensitivity
  id: set_sensitivity
  entity_category: config
  on_press:
  - switch.turn_off: mmwave_sensor
  - delay: 1s
  - uart.write:
      id: uart_presence
      data: !lambda std::string mss = "setSensitivity " + 
        to_string(id(sensitivity_occupancy).state) + " " + 
        to_string(id(sensitivity_movement).state); return std::vector<unsigned 
        char>(mss.begin(), mss.end());
  - delay: 1s
  - uart.write:
      id: uart_presence
      data: saveConfig
  - delay: 1s
  - switch.turn_on: mmwave_sensor

- platform: template
  name: Restart mmWave Sensor
  id: restart_mmwave
  entity_category: config
  internal: true
  on_press:
  - uart.write:
      id: uart_presence
      data: resetSystem

- platform: template
  name: Factory Reset mmWave
  icon: mdi:cog-counterclockwise
  id: factory_reset_mmwave
  disabled_by_default: true
  entity_category: config
  on_press:
  - switch.turn_off: mmwave_sensor
  - delay: 1s
  - uart.write:
      id: uart_presence
      data: resetCfg
  - delay: 3s
  - switch.turn_on: mmwave_sensor


